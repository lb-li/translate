name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Build Release EXE
        run: cargo build --release -p app-ui

      - name: Prepare Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/app-ui.exe dist/lumen-translate.exe

      - name: Upload lumen-translate.exe
        uses: actions/upload-artifact@v4
        with:
          name: lumen-translate-windows-x64
          path: dist/lumen-translate.exe
