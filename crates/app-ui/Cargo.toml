[package]
name = "app-ui"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
arboard.workspace = true
core-capture = { path = "../core-capture" }
core-storage = { path = "../core-storage" }
core-translate = { path = "../core-translate" }
